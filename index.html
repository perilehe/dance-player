<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Evia's Dance Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <div id="app">
    <!-- ====== Left Panel: Library + Playlist ====== -->
    <section class="panel-left" id="panel-left">
      <header id="header">
        <h1> Evia's Dance Party~</h1>
        <div id="loading-indicator" class="hidden">
          <span class="spinner"></span>
        </div>
      </header>

      <!-- Tabs -->
      <nav id="tabs">
        <button class="tab active" data-tab="library">Library</button>
        <button class="tab" data-tab="playlist">Playlist</button>
      </nav>

      <!-- Library Tab -->
      <div id="library-tab" class="tab-content active">
        <div class="filter-bar">
          <select id="category-filter">
            <option value="">All Styles</option>
          </select>
          <input type="text" id="search-input" placeholder="Search songs...">
        </div>
        <div id="track-list" class="track-list"></div>
      </div>

      <!-- Playlist Tab -->
      <div id="playlist-tab" class="tab-content">
        <div class="playlist-header">
          <select id="playlist-select">
            <option value="">-- Pick a Playlist --</option>
          </select>
          <button id="btn-new-playlist" class="icon-btn" title="New">+</button>
          <button id="btn-edit-playlist" class="icon-btn edit-btn" title="Edit">Edit</button>
        </div>
        <!-- Normal view: just the playlist tracks -->
        <div id="playlist-tracks" class="track-list"></div>
        <!-- Edit mode: add section + delete buttons visible -->
        <div id="playlist-edit-section" class="playlist-edit-section hidden">
          <div class="playlist-add-section">
            <div class="section-label">Add Songs</div>
            <div class="add-filter-bar">
              <select id="add-category-filter">
                <option value="">All Styles</option>
              </select>
              <input type="text" id="add-search-input" placeholder="Search to add...">
            </div>
            <div id="add-track-list" class="track-list add-list"></div>
          </div>
          <div class="playlist-actions">
            <button id="btn-done-edit" class="done-btn">Done</button>
          </div>
        </div>
        <div class="playlist-actions-bottom">
          <button id="btn-export-playlist">Export</button>
          <button id="btn-import-playlist">Import</button>
          <button id="btn-delete-playlist" class="danger">Delete List</button>
        </div>
      </div>
    </section>

    <!-- ====== Right Panel: Player ====== -->
    <section class="panel-right" id="panel-right">
      <!-- Now Playing Info -->
      <div class="now-playing">
        <div class="np-label">Now Playing</div>
        <div class="track-title" id="track-title">Not Playing</div>
        <div class="track-meta">
          <span id="track-category" class="meta-tag">-</span>
          <span class="meta-divider">·</span>
          <span id="track-bpm">-</span> <span class="meta-unit">BPM</span>
          <span class="meta-divider">·</span>
          <span id="track-duration" class="meta-unit">--:--</span>
        </div>
      </div>

      <!-- Progress Bar (BIG): left = current, right = remaining -->
      <div class="progress-section">
        <div class="progress-times">
          <span id="current-time">0:00</span>
          <span id="remaining-time" class="remaining">-0:00</span>
        </div>
        <input type="range" id="progress" class="progress-bar" min="0" max="100" value="0" step="0.1">
      </div>

      <!-- Transport Controls (rectangular rounded) -->
      <div class="transport">
        <button id="btn-prev" class="transport-btn" title="Previous">⏮</button>
        <button id="btn-play" class="transport-btn play-btn" title="Play">▶ Play</button>
        <button id="btn-pause" class="transport-btn pause-btn disabled" title="Pause"> Pause</button>
        <button id="btn-next" class="transport-btn" title="Next"></button>
      </div>

      <!-- Play Mode: 3 big buttons -->
      <div class="play-modes">
        <button class="pm-btn active" data-mode="list" id="pm-list">
          <span class="pm-icon">🔂</span>
          <span class="pm-label">Loop List</span>
        </button>
        <button class="pm-btn" data-mode="single" id="pm-single">
          <span class="pm-icon">🔁</span>
          <span class="pm-label">Loop One</span>
        </button>
        <button class="pm-btn" data-mode="seq" id="pm-seq">
          <span class="pm-icon">▶️</span>
          <span class="pm-label">In Order</span>
        </button>
      </div>

      <!-- Volume -->
      <div class="volume-row">
        <span class="vol-icon">🔊</span>
        <input type="range" id="volume" min="0" max="100" value="80">
      </div>

      <!-- Speed -->
      <div class="player-section">
        <div class="section-label">Speed</div>
        <div class="speed-row">
          <input type="range" id="speed" min="50" max="110" value="100" step="1">
          <span id="speed-label" class="speed-value">1.00x</span>
        </div>
        <div class="speed-presets">
          <button class="preset-btn" data-speed="50">0.50x</button>
          <button class="preset-btn" data-speed="60">0.60x</button>
          <button class="preset-btn" data-speed="75">0.75x</button>
          <button class="preset-btn" data-speed="80">0.80x</button>
          <button class="preset-btn" data-speed="85">0.85x</button>
          <button class="preset-btn" data-speed="90">0.90x</button>
          <button class="preset-btn" data-speed="95">0.95x</button>
          <button class="preset-btn active" data-speed="100">1.0x</button>
          <button class="preset-btn" data-speed="110">1.1x</button>
        </div>
      </div>

      <!-- Beat / Rhythm -->
      <div class="player-section">
        <div class="section-label">Beat</div>
        <div class="beat-row">
          <label class="toggle-label">
            <input type="checkbox" id="toggle-metronome">
            <span class="toggle-text">Metronome</span>
          </label>
          <label>Vol</label>
          <input type="range" id="metro-vol" class="metro-vol-slider" min="0" max="100" value="60">
        </div>
        <div class="beat-row">
          <label>BPM</label>
          <input type="number" id="bpm-input" min="40" max="300" placeholder="Type BPM">
          <button id="btn-detect-bpm" class="sm-btn">Detect</button>
          <span id="bpm-saved-hint" class="bpm-hint hidden">Saved!</span>
        </div>
        <div class="beat-row">
          <label>Time</label>
          <select id="time-signature">
            <option value="4">4/4 (1-2-3-4)</option>
            <option value="8" selected>8 count (5-6-7-8)</option>
          </select>
        </div>
      </div>

      <!-- Mobile: swipe hint -->
      <div class="swipe-hint" id="swipe-hint">← Swipe to Library →</div>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
